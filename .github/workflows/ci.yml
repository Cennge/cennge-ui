name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      # Each typical import stays within its size: catches tree shaking breaking.
      - run: pnpm size

  # React 19 is what the lockfile has, tested above. These swap in an older React after the build.
  react:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Testing Library 13 and later need React 18.
          - react: 17
            testing-library: 12
          - react: 18
            testing-library: 16
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built as published, with the lockfile's React 19 types.
      - run: pnpm build
      - run: >-
          pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }}
          @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
          @testing-library/react@${{ matrix.testing-library }}
      - run: pnpm test
      # The published declarations, compiled the way an app on this React would.
      - run: pnpm exec tsc -p tests/types

  next:
    name: Next.js · server rendering and hydration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Firefox in a window on a virtual display, for WebGL (see the Playwright job).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
      # Packs the package, builds tests/next/app on it outside the repository, checks it in every browser.
      - run: xvfb-run --auto-servernum pnpm check:next
        env:
          CENNGE_FIREFOX_HEADED: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-next
          path: |
            tests/next/playwright-report
            tests/next/test-results
          retention-days: 7

  e2e:
    name: Playwright · ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium --project=chromium-mobile
          - engine: firefox
            projects: --project=firefox
            # Headless Firefox has no GL on Linux; the map needs WebGL. A window on a virtual display instead.
            display: xvfb-run --auto-servernum
          - engine: webkit
            projects: --project=webkit --project=webkit-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - if: matrix.engine == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
      - run: ${{ matrix.display }} pnpm exec playwright test ${{ matrix.projects }}
        env:
          CENNGE_FIREFOX_HEADED: ${{ matrix.engine == 'firefox' && '1' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: |
            playwright-report
            test-results
          retention-days: 7
